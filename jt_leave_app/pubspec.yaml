name: jt_leave_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">= 3.10.0 <4.0.0"

dependencies:
  
  cloud_firestore: ^6.1.2
  file_picker: ^10.3.10
  firebase_admin: ^0.3.1
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
